<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Logs - Destawed</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* Login Page */
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-box {
      background: #1e293b;
      padding: 40px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .login-box h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #f8fafc;
    }

    .login-box p {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #94a3b8;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #f8fafc;
      font-size: 16px;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    .btn {
      width: 100%;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .btn-primary:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    .error-message {
      background: #7f1d1d;
      color: #fecaca;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    /* Dashboard */
    .dashboard {
      display: none;
    }

    .header {
      background: #1e293b;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .header h1 {
      font-size: 20px;
      color: #f8fafc;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .env-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .env-production { background: #dc2626; color: white; }
    .env-development { background: #f59e0b; color: black; }
    .env-local { background: #22c55e; color: white; }

    .btn-logout {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-logout:hover {
      background: #334155;
      color: #f8fafc;
    }

    /* Filters */
    .filters {
      background: #1e293b;
      padding: 16px 24px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .filter-group label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .filter-group select,
    .filter-group input {
      padding: 8px 12px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #0f172a;
      color: #f8fafc;
      font-size: 14px;
      min-width: 150px;
    }

    .filter-group select:focus,
    .filter-group input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    .btn-refresh {
      padding: 8px 16px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-left: auto;
    }

    .btn-refresh:hover {
      background: #2563eb;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      padding: 24px;
    }

    .stat-card {
      background: #1e293b;
      padding: 20px;
      border-radius: 8px;
      border-left: 4px solid;
    }

    .stat-card.errors { border-color: #ef4444; }
    .stat-card.warnings { border-color: #f59e0b; }
    .stat-card.info { border-color: #3b82f6; }
    .stat-card.total { border-color: #8b5cf6; }

    .stat-card h3 {
      font-size: 12px;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 32px;
      font-weight: 700;
      color: #f8fafc;
    }

    /* Logs Table */
    .logs-container {
      padding: 0 24px 24px;
    }

    .logs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .logs-header h2 {
      font-size: 18px;
      color: #f8fafc;
    }

    .logs-count {
      color: #64748b;
      font-size: 14px;
    }

    .logs-table {
      width: 100%;
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
    }

    .logs-table table {
      width: 100%;
      border-collapse: collapse;
    }

    .logs-table th {
      text-align: left;
      padding: 12px 16px;
      background: #334155;
      color: #94a3b8;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .logs-table td {
      padding: 12px 16px;
      border-bottom: 1px solid #334155;
      font-size: 14px;
      vertical-align: top;
    }

    .logs-table tr:last-child td {
      border-bottom: none;
    }

    .logs-table tr:hover {
      background: #334155;
    }

    .level-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .level-error { background: #7f1d1d; color: #fecaca; }
    .level-warn { background: #78350f; color: #fde68a; }
    .level-info { background: #1e3a8a; color: #bfdbfe; }
    .level-debug { background: #064e3b; color: #a7f3d0; }

    .log-message {
      max-width: 400px;
      word-break: break-word;
    }

    .log-path {
      color: #94a3b8;
      font-family: monospace;
      font-size: 13px;
    }

    .log-time {
      color: #64748b;
      white-space: nowrap;
      font-size: 13px;
    }

    .btn-details {
      padding: 4px 8px;
      background: #334155;
      border: none;
      border-radius: 4px;
      color: #94a3b8;
      cursor: pointer;
      font-size: 12px;
    }

    .btn-details:hover {
      background: #475569;
      color: #f8fafc;
    }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
    }

    .pagination button {
      padding: 8px 16px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 6px;
      cursor: pointer;
    }

    .pagination button:hover:not(:disabled) {
      background: #334155;
      color: #f8fafc;
    }

    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .pagination .current {
      background: #3b82f6;
      border-color: #3b82f6;
      color: white;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal {
      background: #1e293b;
      border-radius: 12px;
      width: 100%;
      max-width: 800px;
      max-height: 80vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 16px 24px;
      background: #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 16px;
      color: #f8fafc;
    }

    .modal-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
    }

    .modal-close:hover {
      color: #f8fafc;
    }

    .modal-body {
      padding: 24px;
      overflow-y: auto;
    }

    .detail-row {
      margin-bottom: 16px;
    }

    .detail-row label {
      display: block;
      font-size: 12px;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .detail-row .value {
      color: #f8fafc;
      font-size: 14px;
    }

    .detail-row pre {
      background: #0f172a;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 13px;
      color: #fca5a5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Loading */
    .loading {
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .filters {
        flex-direction: column;
        align-items: stretch;
      }

      .filter-group select,
      .filter-group input {
        min-width: 100%;
      }

      .btn-refresh {
        margin-left: 0;
        width: 100%;
      }

      .logs-table {
        overflow-x: auto;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <!-- Login Page -->
  <div id="loginPage" class="login-container">
    <div class="login-box">
      <h1>System Logs</h1>
      <p>Login with admin credentials to view logs</p>

      <div id="loginError" class="error-message"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required placeholder="admin@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="Enter password">
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">Login</button>
      </form>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="dashboard">
    <header class="header">
      <h1>System Logs</h1>
      <div class="header-right">
        <span id="envBadge" class="env-badge env-development">Development</span>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>
    </header>

    <div class="filters">
      <div class="filter-group">
        <label>Log Type</label>
        <select id="logType">
          <option value="error">Errors</option>
          <option value="combined">All Logs</option>
          <option value="requests">Requests</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Date</label>
        <input type="date" id="logDate">
      </div>
      <div class="filter-group">
        <label>Level</label>
        <select id="logLevel">
          <option value="">All Levels</option>
          <option value="error">Error</option>
          <option value="warn">Warning</option>
          <option value="info">Info</option>
          <option value="debug">Debug</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Search</label>
        <input type="text" id="searchTerm" placeholder="Search logs...">
      </div>
      <button class="btn-refresh" onclick="loadLogs()">Refresh</button>
    </div>

    <div class="stats" id="stats">
      <div class="stat-card errors">
        <h3>Errors (Today)</h3>
        <div class="value" id="statErrors">-</div>
      </div>
      <div class="stat-card warnings">
        <h3>Warnings</h3>
        <div class="value" id="statWarnings">-</div>
      </div>
      <div class="stat-card info">
        <h3>Info</h3>
        <div class="value" id="statInfo">-</div>
      </div>
      <div class="stat-card total">
        <h3>Total Logs</h3>
        <div class="value" id="statTotal">-</div>
      </div>
    </div>

    <div class="logs-container">
      <div class="logs-header">
        <h2>Log Entries</h2>
        <span class="logs-count" id="logsCount"></span>
      </div>

      <div id="logsContent">
        <div class="loading">
          <div class="spinner"></div>
        </div>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3>Log Details</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    // Configuration
    const API_BASE = window.location.origin + '/api/v1';
    let token = localStorage.getItem('logs_admin_token');
    let currentPage = 1;
    let currentLogs = [];

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      // Set today's date
      document.getElementById('logDate').value = new Date().toISOString().split('T')[0];

      if (token) {
        showDashboard();
      }

      // Login form
      document.getElementById('loginForm').addEventListener('submit', handleLogin);

      // Filter changes
      ['logType', 'logDate', 'logLevel'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => {
          currentPage = 1;
          loadLogs();
        });
      });

      // Search with debounce
      let searchTimeout;
      document.getElementById('searchTerm').addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
          currentPage = 1;
          loadLogs();
        }, 500);
      });
    });

    // Login
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const errorEl = document.getElementById('loginError');

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';
      errorEl.style.display = 'none';

      try {
        const response = await fetch(`${API_BASE}/admins/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email,
            password,
            device_id: 'logs-viewer-' + Date.now(),
            device_name: 'Logs Viewer',
            device_type: 'web'
          })
        });

        const data = await response.json();

        if (response.ok && data.data?.access_token) {
          token = data.data.access_token;
          localStorage.setItem('logs_admin_token', token);
          showDashboard();
        } else {
          throw new Error(data.message || 'Login failed');
        }
      } catch (error) {
        errorEl.textContent = error.message;
        errorEl.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    }

    // Logout
    function logout() {
      token = null;
      localStorage.removeItem('logs_admin_token');
      document.getElementById('loginPage').style.display = 'flex';
      document.getElementById('dashboard').style.display = 'none';
    }

    // Show Dashboard
    function showDashboard() {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadStats();
      loadLogs();
    }

    // API Request
    async function apiRequest(endpoint) {
      const response = await fetch(`${API_BASE}${endpoint}`, {
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      });

      if (response.status === 401) {
        logout();
        throw new Error('Session expired');
      }

      return response.json();
    }

    // Load Stats
    async function loadStats() {
      try {
        const data = await apiRequest('/admin/logs/stats?days=7');
        if (data.data) {
          const stats = data.data;
          document.getElementById('statErrors').textContent = stats.byLevel?.error || 0;
          document.getElementById('statWarnings').textContent = stats.byLevel?.warn || 0;
          document.getElementById('statInfo').textContent = stats.byLevel?.info || 0;
          document.getElementById('statTotal').textContent = stats.totalLogs || 0;

          // Update environment badge
          if (stats.recentErrors?.[0]?.environment) {
            const env = stats.recentErrors[0].environment;
            const badge = document.getElementById('envBadge');
            badge.textContent = env.charAt(0).toUpperCase() + env.slice(1);
            badge.className = `env-badge env-${env}`;
          }
        }
      } catch (error) {
        console.error('Failed to load stats:', error);
      }
    }

    // Load Logs
    async function loadLogs() {
      const type = document.getElementById('logType').value;
      const date = document.getElementById('logDate').value;
      const level = document.getElementById('logLevel').value;
      const search = document.getElementById('searchTerm').value;

      const logsContent = document.getElementById('logsContent');
      logsContent.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      try {
        let url = `/admin/logs?type=${type}&date=${date}&page=${currentPage}&limit=50`;
        if (level) url += `&level=${level}`;
        if (search) url += `&search=${encodeURIComponent(search)}`;

        const data = await apiRequest(url);

        if (data.data) {
          currentLogs = data.data.logs || [];
          renderLogs(currentLogs, data.data.total, data.data.page, data.data.limit);
        }
      } catch (error) {
        logsContent.innerHTML = `<div class="empty-state"><p>Error loading logs: ${error.message}</p></div>`;
      }
    }

    // Render Logs
    function renderLogs(logs, total, page, limit) {
      const logsContent = document.getElementById('logsContent');
      const logsCount = document.getElementById('logsCount');

      logsCount.textContent = `Showing ${logs.length} of ${total} logs`;

      if (logs.length === 0) {
        logsContent.innerHTML = `
          <div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <p>No logs found for the selected criteria</p>
          </div>
        `;
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      let html = `
        <div class="logs-table">
          <table>
            <thead>
              <tr>
                <th>Time</th>
                <th>Level</th>
                <th>Message</th>
                <th>Path</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
      `;

      logs.forEach((log, index) => {
        const time = log.timestamp ? new Date(log.timestamp).toLocaleString() : '-';
        const level = log.level || 'info';
        const message = (log.message || '-').substring(0, 100) + (log.message?.length > 100 ? '...' : '');
        const path = log.path || '-';
        const status = log.statusCode || '-';

        html += `
          <tr>
            <td class="log-time">${time}</td>
            <td><span class="level-badge level-${level}">${level}</span></td>
            <td class="log-message">${escapeHtml(message)}</td>
            <td class="log-path">${escapeHtml(path)}</td>
            <td>${status}</td>
            <td><button class="btn-details" onclick="showDetails(${index})">Details</button></td>
          </tr>
        `;
      });

      html += '</tbody></table></div>';
      logsContent.innerHTML = html;

      // Pagination
      renderPagination(total, page, limit);
    }

    // Render Pagination
    function renderPagination(total, page, limit) {
      const totalPages = Math.ceil(total / limit);
      const pagination = document.getElementById('pagination');

      if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
      }

      let html = `
        <button onclick="goToPage(${page - 1})" ${page <= 1 ? 'disabled' : ''}>Previous</button>
        <button class="current">${page} / ${totalPages}</button>
        <button onclick="goToPage(${page + 1})" ${page >= totalPages ? 'disabled' : ''}>Next</button>
      `;

      pagination.innerHTML = html;
    }

    // Go to Page
    function goToPage(page) {
      currentPage = page;
      loadLogs();
    }

    // Show Details Modal
    function showDetails(index) {
      const log = currentLogs[index];
      if (!log) return;

      const modalBody = document.getElementById('modalBody');

      let html = `
        <div class="detail-row">
          <label>Timestamp</label>
          <div class="value">${log.timestamp ? new Date(log.timestamp).toLocaleString() : '-'}</div>
        </div>
        <div class="detail-row">
          <label>Level</label>
          <div class="value"><span class="level-badge level-${log.level || 'info'}">${log.level || 'info'}</span></div>
        </div>
        <div class="detail-row">
          <label>Message</label>
          <div class="value">${escapeHtml(log.message || '-')}</div>
        </div>
      `;

      if (log.path) {
        html += `
          <div class="detail-row">
            <label>Path</label>
            <div class="value">${escapeHtml(log.method || '')} ${escapeHtml(log.path)}</div>
          </div>
        `;
      }

      if (log.statusCode) {
        html += `
          <div class="detail-row">
            <label>Status Code</label>
            <div class="value">${log.statusCode}</div>
          </div>
        `;
      }

      if (log.ip) {
        html += `
          <div class="detail-row">
            <label>IP Address</label>
            <div class="value">${escapeHtml(log.ip)}</div>
          </div>
        `;
      }

      if (log.userId) {
        html += `
          <div class="detail-row">
            <label>User ID</label>
            <div class="value">${escapeHtml(log.userId)}</div>
          </div>
        `;
      }

      if (log.stack) {
        html += `
          <div class="detail-row">
            <label>Stack Trace</label>
            <pre>${escapeHtml(log.stack)}</pre>
          </div>
        `;
      }

      if (log.body && Object.keys(log.body).length > 0) {
        html += `
          <div class="detail-row">
            <label>Request Body</label>
            <pre>${escapeHtml(JSON.stringify(log.body, null, 2))}</pre>
          </div>
        `;
      }

      if (log.query && Object.keys(log.query).length > 0) {
        html += `
          <div class="detail-row">
            <label>Query Parameters</label>
            <pre>${escapeHtml(JSON.stringify(log.query, null, 2))}</pre>
          </div>
        `;
      }

      modalBody.innerHTML = html;
      document.getElementById('modalOverlay').style.display = 'flex';
    }

    // Close Modal
    function closeModal(event) {
      if (!event || event.target === document.getElementById('modalOverlay')) {
        document.getElementById('modalOverlay').style.display = 'none';
      }
    }

    // Escape HTML
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Close modal on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
